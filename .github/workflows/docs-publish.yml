name: Deploy

on:
  push:
    paths:
      - 'docs/**'
defaults:
  run:
    shell: bash
    working-directory: ./docs

jobs:
  github_pages_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Identify dependency runtime
        id: dependency-runtime
        shell: bash
        run: |
          IDENTITY="$(node -p 'JSON.stringify([process.version, process.versions.modules, process.platform, process.arch])')|$(npm --version)|${ImageOS:-}|${ImageVersion:-}"
          echo "fingerprint=$(printf '%s' "$IDENTITY" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore installed Node dependencies
        id: installed-dependencies
        uses: actions/cache/restore@v4
        with:
          path: docs/node_modules
          key: installed-node-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-runtime.outputs.fingerprint }}-${{ hashFiles('docs/package.json', 'docs/package-lock.json', 'docs/yarn.lock', 'docs/.npmrc', 'docs/.yarnrc.yml') }}-end
      - name: Install dependencies
        if: steps.installed-dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed Node dependencies
        if: steps.installed-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docs/node_modules
          key: ${{ steps.installed-dependencies.outputs.cache-primary-key }}
      - name: Export documentation
        run: npm run export
      - name: Deploy with gh-pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
